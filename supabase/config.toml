# Supabase CLI config (`supabase start`, `supabase db reset`).
project_id = "restaurant-os"

[api]
schemas = ["public"]          # the private `app` schema is deliberately not exposed
extra_search_path = ["public", "extensions"]

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
enable_signup = true

[auth.email]
enable_confirmations = false
